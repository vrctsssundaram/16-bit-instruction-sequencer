name: Generic RTL synthesis
on: [push, pull_request, workflow_dispatch]
jobs:
  synthesis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install synthesizer
        run: sudo apt-get update -qq && sudo apt-get install -y yosys
      - name: Synthesize microseq16
        run: yosys -Q -T -p 'read_verilog -sv rtl/microseq16.sv; hierarchy -check -top microseq16; synth -top microseq16; stat'
